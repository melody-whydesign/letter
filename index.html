<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>3D Voice Letter Path Wave</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FontLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/TextGeometry.js"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  font-family: Helvetica, Arial, sans-serif;
  background: #f7d000;
  color: #222;
}

.app {
  height: 100vh;
  display: grid;
  grid-template-columns: 370px 1fr;
  gap: 22px;
  padding: 22px;
}

.panel,
.stage {
  border-radius: 28px;
  background: rgba(255,255,255,.94);
  box-shadow: 0 24px 70px rgba(0,0,0,.16);
  overflow: hidden;
}

.panel {
  padding: 26px;
  overflow-y: auto;
}

.stage {
  position: relative;
  background: #000;
}

h1 {
  margin: 0 0 22px;
  font-size: 30px;
  letter-spacing: -0.04em;
}

label {
  display: block;
  font-weight: 800;
  margin: 18px 0 8px;
}

input[type="text"] {
  width: 100%;
  height: 48px;
  border: 1px solid rgba(0,0,0,.12);
  border-radius: 14px;
  padding: 0 14px;
  font-size: 20px;
  text-transform: uppercase;
  font-family: Helvetica, Arial, sans-serif;
}

input[type="range"] {
  width: 100%;
  accent-color: #111;
}

.button {
  width: 100%;
  height: 50px;
  margin: 8px 0;
  border: 0;
  border-radius: 14px;
  background: #111;
  color: #fff;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
}

.button.secondary {
  background: #777;
}

.button.recording {
  background: #e00000;
}

.value {
  float: right;
  color: #666;
  font-size: 13px;
}

.small {
  color: #666;
  font-size: 13px;
  line-height: 1.45;
}

#viewer {
  width: 100%;
  height: 100%;
  display: block;
  cursor: grab;
}

.badge {
  position: absolute;
  left: 24px;
  top: 22px;
  z-index: 2;
  padding: 10px 14px;
  border-radius: 999px;
  background: rgba(255,255,255,.82);
  font-size: 13px;
  font-weight: 800;
  color: #555;
}

@media(max-width:900px) {
  body { overflow: auto; height: auto; }
  .app { grid-template-columns: 1fr; height: auto; }
  .stage { height: 70vh; min-height: 500px; }
}
</style>
</head>

<body>
<div class="app">
  <aside class="panel">
    <h1>3D Voice Letter Path Wave</h1>

    <label>Letters</label>
    <input id="lettersInput" type="text" value="A" maxlength="8" />

    <button id="recordBtn" class="button">Start Recording</button>
    <button id="stopBtn" class="button secondary" disabled>Stop Recording</button>

    <label>Path density <span id="densityValue" class="value">120</span></label>
    <input id="densitySlider" type="range" min="60" max="260" value="120" />

    <label>Wave offset from letter <span id="distanceValue" class="value">12 mm</span></label>
    <input id="distanceSlider" type="range" min="2" max="40" value="12" />

    <label>Voice wave height <span id="waveValue" class="value">18 mm</span></label>
    <input id="waveSlider" type="range" min="2" max="45" value="18" />

    <label>Twist depth <span id="twistValue" class="value">1.2</span></label>
    <input id="twistSlider" type="range" min="0" max="3" step="0.1" value="1.2" />

    <label>Line thickness <span id="thicknessValue" class="value">1.4 mm</span></label>
    <input id="thicknessSlider" type="range" min="0.6" max="4" step="0.1" value="1.4" />

    <label>Letter depth <span id="depthValue" class="value">3 mm</span></label>
    <input id="depthSlider" type="range" min="1" max="8" step="0.5" value="3" />

    <label>Wave layers <span id="layersValue" class="value">18</span></label>
    <input id="layersSlider" type="range" min="4" max="36" value="18" />

    <button id="generateBtn" class="button">Generate 3D Model</button>
    <button id="downloadBtn" class="button">Download STL</button>
    <button id="resetBtn" class="button secondary">Reset</button>

    <p class="small">
      Each letter has its own soundwave. The wave follows the outer path of the letterform instead of forming a circle.
      The letter outline stays clean, while the voice wave twists and morphs from the letter’s contour.
    </p>
  </aside>

  <section class="stage">
    <div class="badge">3D preview • wave follows each letter path</div>
    <canvas id="viewer"></canvas>
  </section>
</div>

<script>
const $ = id => document.getElementById(id);

const lettersInput = $("lettersInput");
const recordBtn = $("recordBtn");
const stopBtn = $("stopBtn");
const generateBtn = $("generateBtn");
const downloadBtn = $("downloadBtn");
const resetBtn = $("resetBtn");

const densitySlider = $("densitySlider");
const distanceSlider = $("distanceSlider");
const waveSlider = $("waveSlider");
const twistSlider = $("twistSlider");
const thicknessSlider = $("thicknessSlider");
const depthSlider = $("depthSlider");
const layersSlider = $("layersSlider");

const densityValue = $("densityValue");
const distanceValue = $("distanceValue");
const waveValue = $("waveValue");
const twistValue = $("twistValue");
const thicknessValue = $("thicknessValue");
const depthValue = $("depthValue");
const layersValue = $("layersValue");

let scene, camera, renderer;
let modelGroup;
let font;
let mediaRecorder;
let chunks = [];
let audioContext;
let toneData = [];
let stlText = "";

initScene();
loadFont();
updateLabels();

function initScene() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x000000);

  camera = new THREE.PerspectiveCamera(35, 1, 0.1, 3000);
  camera.position.set(0, 0, 460);

  renderer = new THREE.WebGLRenderer({
    canvas: $("viewer"),
    antialias: true
  });

  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  scene.add(new THREE.AmbientLight(0xffffff, 1.2));

  const l1 = new THREE.DirectionalLight(0xffffff, 3);
  l1.position.set(3, 5, 5);
  scene.add(l1);

  const l2 = new THREE.DirectionalLight(0xffffff, 2);
  l2.position.set(-4, -2, 5);
  scene.add(l2);

  window.addEventListener("resize", resize);
  resize();

  let dragging = false;
  let lastX = 0;
  let lastY = 0;

  renderer.domElement.addEventListener("pointerdown", e => {
    dragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
  });

  renderer.domElement.addEventListener("pointermove", e => {
    if (!dragging || !modelGroup) return;
    modelGroup.rotation.y += (e.clientX - lastX) * 0.01;
    modelGroup.rotation.x += (e.clientY - lastY) * 0.01;
    lastX = e.clientX;
    lastY = e.clientY;
  });

  renderer.domElement.addEventListener("pointerup", () => dragging = false);
  renderer.domElement.addEventListener("pointerleave", () => dragging = false);

  animate();
}

function resize() {
  const parent = $("viewer").parentElement;
  const w = parent.clientWidth;
  const h = parent.clientHeight;

  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}

function animate() {
  requestAnimationFrame(animate);

  if (modelGroup) {
    modelGroup.rotation.y += 0.0012;
  }

  renderer.render(scene, camera);
}

function loadFont() {
  const loader = new THREE.FontLoader();

  loader.load(
    "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/fonts/helvetiker_bold.typeface.json",
    loaded => {
      font = loaded;
      toneData = defaultTone();
      generateModel();
    }
  );
}

function updateLabels() {
  densityValue.textContent = densitySlider.value;
  distanceValue.textContent = distanceSlider.value + " mm";
  waveValue.textContent = waveSlider.value + " mm";
  twistValue.textContent = twistSlider.value;
  thicknessValue.textContent = thicknessSlider.value + " mm";
  depthValue.textContent = depthSlider.value + " mm";
  layersValue.textContent = layersSlider.value;
}

function material() {
  return new THREE.MeshStandardMaterial({
    color: 0xffffff,
    metalness: 0.15,
    roughness: 0.3
  });
}

function defaultTone() {
  return Array.from({ length: 220 }, (_, i) => ({
    volume: 0.42 + 0.25 * Math.sin(i * 0.12),
    pitch: 0.45 + 0.35 * Math.sin(i * 0.073 + 1.2),
    brightness: 0.45 + 0.3 * Math.cos(i * 0.105)
  }));
}

function normalize(v, min, max) {
  return Math.max(0, Math.min(1, (v - min) / (max - min)));
}

function autoCorrelate(buffer, sampleRate) {
  let rms = 0;

  for (let i = 0; i < buffer.length; i++) {
    rms += buffer[i] * buffer[i];
  }

  rms = Math.sqrt(rms / buffer.length);
  if (rms < 0.01) return 0;

  let bestOffset = -1;
  let bestCorrelation = 0;

  for (let offset = 20; offset < 1000; offset++) {
    let correlation = 0;

    for (let i = 0; i < buffer.length - offset; i++) {
      correlation += 1 - Math.abs(buffer[i] - buffer[i + offset]);
    }

    correlation /= buffer.length - offset;

    if (correlation > bestCorrelation) {
      bestCorrelation = correlation;
      bestOffset = offset;
    }
  }

  return bestCorrelation > 0.72 ? sampleRate / bestOffset : 0;
}

function brightness(samples) {
  let zero = 0;

  for (let i = 1; i < samples.length; i++) {
    if (
      (samples[i - 1] < 0 && samples[i] >= 0) ||
      (samples[i - 1] >= 0 && samples[i] < 0)
    ) {
      zero++;
    }
  }

  return normalize(zero / samples.length, 0.02, 0.25);
}

async function analyzeAudio(arrayBuffer) {
  audioContext = audioContext || new AudioContext();

  const audioBuffer = await audioContext.decodeAudioData(arrayBuffer.slice(0));
  const data = audioBuffer.getChannelData(0);
  const sampleRate = audioBuffer.sampleRate;

  const frameSize = 2048;
  const hop = 1024;
  const frames = [];

  for (let i = 0; i < data.length - frameSize; i += hop) {
    const frame = data.slice(i, i + frameSize);

    let volume = 0;

    for (let j = 0; j < frame.length; j++) {
      volume += frame[j] * frame[j];
    }

    volume = Math.sqrt(volume / frame.length);

    const pitch = autoCorrelate(frame, sampleRate);

    frames.push({
      volume: normalize(volume, 0.005, 0.12),
      pitch: pitch ? normalize(pitch, 80, 700) : 0.3,
      brightness: brightness(frame)
    });
  }

  toneData = frames.length ? frames : defaultTone();
  generateModel();
}

function toneAt(i) {
  if (!toneData.length) toneData = defaultTone();
  return toneData[Math.abs(i) % toneData.length];
}

recordBtn.onclick = async () => {
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

  chunks = [];
  mediaRecorder = new MediaRecorder(stream);

  mediaRecorder.ondataavailable = e => {
    if (e.data.size) chunks.push(e.data);
  };

  mediaRecorder.onstop = async () => {
    const blob = new Blob(chunks, { type: "audio/webm" });
    const buffer = await blob.arrayBuffer();

    await analyzeAudio(buffer);

    stream.getTracks().forEach(track => track.stop());
  };

  mediaRecorder.start();

  recordBtn.classList.add("recording");
  recordBtn.textContent = "Recording...";
  recordBtn.disabled = true;
  stopBtn.disabled = false;
};

stopBtn.onclick = () => {
  if (mediaRecorder && mediaRecorder.state !== "inactive") {
    mediaRecorder.stop();
  }

  recordBtn.classList.remove("recording");
  recordBtn.textContent = "Start Recording";
  recordBtn.disabled = false;
  stopBtn.disabled = true;
};

function polygonArea(points) {
  let area = 0;

  for (let i = 0; i < points.length; i++) {
    const a = points[i];
    const b = points[(i + 1) % points.length];

    area += a.x * b.y - b.x * a.y;
  }

  return area / 2;
}

function cleanClosedPoints(points) {
  const cleaned = [];

  for (const p of points) {
    if (!cleaned.length || cleaned[cleaned.length - 1].distanceTo(p) > 0.5) {
      cleaned.push(p.clone());
    }
  }

  if (cleaned.length > 2 && cleaned[0].distanceTo(cleaned[cleaned.length - 1]) < 0.5) {
    cleaned.pop();
  }

  return cleaned;
}

function resampleClosedPath(points, count) {
  const path = cleanClosedPoints(points);
  const lengths = [];
  let total = 0;

  for (let i = 0; i < path.length; i++) {
    const a = path[i];
    const b = path[(i + 1) % path.length];
    const d = a.distanceTo(b);
    lengths.push(d);
    total += d;
  }

  const result = [];

  for (let i = 0; i < count; i++) {
    const target = (i / count) * total;
    let acc = 0;

    for (let j = 0; j < path.length; j++) {
      const next = acc + lengths[j];

      if (target <= next) {
        const a = path[j];
        const b = path[(j + 1) % path.length];
        const t = lengths[j] === 0 ? 0 : (target - acc) / lengths[j];

        result.push(new THREE.Vector2(
          a.x + (b.x - a.x) * t,
          a.y + (b.y - a.y) * t
        ));

        break;
      }

      acc = next;
    }
  }

  return result;
}

function getLetterContours(letter) {
  const size = 96;
  const shapes = font.generateShapes(letter, size);

  let all = [];

  shapes.forEach(shape => {
    const outer = cleanClosedPoints(shape.getSpacedPoints(160));
    all.push({
      type: "outer",
      points: outer,
      area: Math.abs(polygonArea(outer))
    });

    shape.holes.forEach(hole => {
      const inner = cleanClosedPoints(hole.getSpacedPoints(100));
      all.push({
        type: "hole",
        points: inner,
        area: Math.abs(polygonArea(inner))
      });
    });
  });

  let minX = Infinity;
  let maxX = -Infinity;
  let minY = Infinity;
  let maxY = -Infinity;

  all.forEach(contour => {
    contour.points.forEach(p => {
      minX = Math.min(minX, p.x);
      maxX = Math.max(maxX, p.x);
      minY = Math.min(minY, p.y);
      maxY = Math.max(maxY, p.y);
    });
  });

  const cx = (minX + maxX) / 2;
  const cy = (minY + maxY) / 2;

  all.forEach(contour => {
    contour.points.forEach(p => {
      p.x -= cx;
      p.y -= cy;
    });
  });

  all.sort((a, b) => b.area - a.area);

  return {
    contours: all,
    outer: all[0],
    width: maxX - minX,
    height: maxY - minY
  };
}

function tubeFrom2DPath(points, xOffset, zOffset, radius, closed = true) {
  const curvePoints = points.map(p => new THREE.Vector3(p.x + xOffset, p.y, zOffset));
  const curve = new THREE.CatmullRomCurve3(curvePoints, closed);

  const geo = new THREE.TubeGeometry(
    curve,
    Math.max(80, points.length * 2),
    radius,
    10,
    closed
  );

  return new THREE.Mesh(geo, material());
}

function createCleanLetterOutline(letter, xOffset) {
  const letterData = getLetterContours(letter);
  const group = new THREE.Group();

  const thickness = Number(thicknessSlider.value);
  const depth = Number(depthSlider.value);

  letterData.contours.forEach(contour => {
    const count = contour.type === "outer" ? 180 : 120;
    const pts = resampleClosedPath(contour.points, count);

    const front = tubeFrom2DPath(pts, xOffset, depth / 2, thickness, true);
    const back = tubeFrom2DPath(pts, xOffset, -depth / 2, thickness, true);

    group.add(front);
    group.add(back);

    for (let i = 0; i < pts.length; i += 8) {
      const p = pts[i];
      const geo = new THREE.CylinderGeometry(thickness, thickness, depth, 10);
      const mesh = new THREE.Mesh(geo, material());

      mesh.position.set(p.x + xOffset, p.y, 0);
      mesh.rotation.x = Math.PI / 2;

      group.add(mesh);
    }
  });

  return {
    group,
    outerPath: resampleClosedPath(letterData.outer.points, Number(densitySlider.value)),
    width: letterData.width,
    height: letterData.height
  };
}

function outwardNormalFromCenter(point) {
  const n = new THREE.Vector2(point.x, point.y);

  if (n.length() < 0.001) {
    return new THREE.Vector2(0, 1);
  }

  return n.normalize();
}

function createLetterPathWave(letterIndex, xOffset, outerPath) {
  const group = new THREE.Group();

  const density = Number(densitySlider.value);
  const offset = Number(distanceSlider.value);
  const waveHeight = Number(waveSlider.value);
  const twist = Number(twistSlider.value);
  const layers = Number(layersSlider.value);
  const tubeRadius = Number(thicknessSlider.value) * 0.48;

  const path = resampleClosedPath(outerPath, density);

  for (let layer = 0; layer < layers; layer++) {
    const layerT = layer / Math.max(1, layers - 1);
    const curvePoints = [];

    for (let i = 0; i < path.length; i++) {
      const p = path[i];
      const prev = path[(i - 1 + path.length) % path.length];
      const next = path[(i + 1) % path.length];

      const tangent = new THREE.Vector2(
        next.x - prev.x,
        next.y - prev.y
      ).normalize();

      const radialNormal = outwardNormalFromCenter(p);
      const sideNormal = new THREE.Vector2(-tangent.y, tangent.x);

      if (sideNormal.dot(radialNormal) < 0) {
        sideNormal.multiplyScalar(-1);
      }

      const tone = toneAt(i + layer * 9 + letterIndex * 47);

      const pitchWave =
        Math.sin(i * 0.12 + tone.pitch * 8 + layerT * Math.PI * 2) *
        tone.pitch *
        waveHeight;

      const brightnessWave =
        Math.cos(i * 0.19 + tone.brightness * 7 - layerT * Math.PI * 3) *
        tone.brightness *
        waveHeight *
        0.75;

      const volumePush = tone.volume * waveHeight * 0.8;

      const contourOffset =
        offset +
        layerT * 10 +
        pitchWave +
        brightnessWave +
        volumePush;

      const twistAlongPath =
        Math.sin(i * 0.1 + layerT * Math.PI * 2) *
        twist *
        10 *
        tone.pitch;

      const morphAlongPath =
        Math.cos(i * 0.16 - layerT * Math.PI * 4) *
        twist *
        8 *
        tone.brightness;

      const x =
        xOffset +
        p.x +
        sideNormal.x * contourOffset +
        tangent.x * morphAlongPath;

      const y =
        p.y +
        sideNormal.y * contourOffset +
        tangent.y * morphAlongPath;

      const z =
        twistAlongPath +
        Math.sin(layerT * Math.PI * 2) * twist * 5;

      curvePoints.push(new THREE.Vector3(x, y, z));
    }

    const curve = new THREE.CatmullRomCurve3(curvePoints, true);

    const geo = new THREE.TubeGeometry(
      curve,
      density * 2,
      tubeRadius,
      8,
      true
    );

    group.add(new THREE.Mesh(geo, material()));
  }

  return group;
}

function generateModel() {
  if (!font) return;

  if (modelGroup) {
    scene.remove(modelGroup);
  }

  modelGroup = new THREE.Group();

  const text = (lettersInput.value || "A")
    .toUpperCase()
    .replace(/[^A-Z0-9]/g, "")
    .slice(0, 8);

  const letterGap = 145;
  const totalWidth = (text.length - 1) * letterGap;

  for (let i = 0; i < text.length; i++) {
    const x = i * letterGap - totalWidth / 2;

    const letter = createCleanLetterOutline(text[i], x);
    const wave = createLetterPathWave(i, x, letter.outerPath);

    modelGroup.add(letter.group);
    modelGroup.add(wave);
  }

  scene.add(modelGroup);

  modelGroup.rotation.x = -0.18;
  modelGroup.rotation.y = 0.28;

  fitCameraToModel();
  stlText = toSTL(modelGroup, "voice_letter_path_wave");
}

function fitCameraToModel() {
  const box = new THREE.Box3().setFromObject(modelGroup);
  const size = new THREE.Vector3();

  box.getSize(size);

  const maxDim = Math.max(size.x, size.y, size.z);
  camera.position.set(0, 0, Math.max(260, maxDim * 1.65));
  camera.lookAt(0, 0, 0);
}

function toSTL(group, name) {
  group.updateMatrixWorld(true);

  let stl = `solid ${name}\n`;

  group.traverse(obj => {
    if (!obj.isMesh) return;

    const geo = obj.geometry.clone();
    geo.applyMatrix4(obj.matrixWorld);

    const pos = geo.getAttribute("position");
    const index = geo.index;

    const normal = new THREE.Vector3();
    const a = new THREE.Vector3();
    const b = new THREE.Vector3();
    const c = new THREE.Vector3();

    const faces = index ? index.count / 3 : pos.count / 3;

    for (let i = 0; i < faces; i++) {
      const ia = index ? index.getX(i * 3) : i * 3;
      const ib = index ? index.getX(i * 3 + 1) : i * 3 + 1;
      const ic = index ? index.getX(i * 3 + 2) : i * 3 + 2;

      a.fromBufferAttribute(pos, ia);
      b.fromBufferAttribute(pos, ib);
      c.fromBufferAttribute(pos, ic);

      normal.crossVectors(
        new THREE.Vector3().subVectors(b, a),
        new THREE.Vector3().subVectors(c, a)
      ).normalize();

      stl += ` facet normal ${normal.x} ${normal.y} ${normal.z}\n`;
      stl += `  outer loop\n`;
      stl += `   vertex ${a.x} ${a.y} ${a.z}\n`;
      stl += `   vertex ${b.x} ${b.y} ${b.z}\n`;
      stl += `   vertex ${c.x} ${c.y} ${c.z}\n`;
      stl += `  endloop\n`;
      stl += ` endfacet\n`;
    }
  });

  stl += `endsolid ${name}`;
  return stl;
}

downloadBtn.onclick = () => {
  stlText = toSTL(modelGroup, "voice_letter_path_wave");

  const blob = new Blob([stlText], { type: "model/stl" });
  const link = document.createElement("a");

  link.href = URL.createObjectURL(blob);
  link.download = "voice-letter-path-wave.stl";
  link.click();

  URL.revokeObjectURL(link.href);
};

resetBtn.onclick = () => {
  lettersInput.value = "A";
  densitySlider.value = 120;
  distanceSlider.value = 12;
  waveSlider.value = 18;
  twistSlider.value = 1.2;
  thicknessSlider.value = 1.4;
  depthSlider.value = 3;
  layersSlider.value = 18;

  toneData = defaultTone();

  updateLabels();
  generateModel();
};

[
  lettersInput,
  densitySlider,
  distanceSlider,
  waveSlider,
  twistSlider,
  thicknessSlider,
  depthSlider,
  layersSlider
].forEach(el => {
  el.addEventListener("input", () => {
    updateLabels();
    generateModel();
  });
});

generateBtn.onclick = generateModel;
</script>
</body>
</html>
