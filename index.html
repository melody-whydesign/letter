<script>
function drawSurroundWave(cx,cy,rx,ry,index,power){
  const count = Number(density.value);
  const phase = index * 41;
  const points = [];

  for(let i=0;i<=count;i++){
    const t = i / count;
    const a = t * Math.PI * 2;

    const d = voiceData[(i + phase) % voiceData.length] || {amp:.4,pitch:.4};

    const twist =
      Math.sin(a * 3 + d.pitch * 9 + index) * d.pitch * .38 +
      Math.sin(a * 7 + d.amp * 5) * d.amp * .18;

    const aa = a + twist;

    const squareMorph = Math.max(
      Math.abs(Math.cos(aa)),
      Math.abs(Math.sin(aa))
    );

    const letterInfluence =
      .72 +
      .28 * Math.sin(aa * 2 + index) +
      .16 * Math.sin(aa * 5 + d.pitch * 8);

    const baseX = Math.cos(aa) * rx / squareMorph;
    const baseY = Math.sin(aa) * ry / squareMorph;

    const toneWave =
      Math.sin(aa * (5 + d.pitch * 20) + d.pitch * 14) *
      power *
      d.pitch *
      .55;

    const volumeWave = d.amp * power;

    const breathe =
      Math.sin(a * 2 + index * 1.7) *
      power *
      .12;

    const offset = volumeWave + toneWave + breathe;

    const nx = baseX / rx;
    const ny = baseY / ry;

    const x = cx + baseX * letterInfluence + nx * offset;
    const y = cy + baseY * letterInfluence + ny * offset;

    points.push({x,y});
  }

  ctx.save();
  ctx.strokeStyle = "rgba(255,255,255,.95)";
  ctx.lineWidth = 1.1;

  for(let layer=0; layer<24; layer++){
    const scale = 1 - layer * .011;
    const shift = layer * .012;
    const alpha = 1 - layer * .038;

    ctx.globalAlpha = alpha;
    ctx.beginPath();

    points.forEach((p,i)=>{
      const px = cx + (p.x - cx) * scale;
      const py = cy + (p.y - cy) * scale;

      const angle = Math.atan2(py-cy, px-cx);
      const twistX = Math.cos(angle + shift * 8) * layer * .42;
      const twistY = Math.sin(angle - shift * 8) * layer * .42;

      if(i===0) ctx.moveTo(px + twistX, py + twistY);
      else ctx.lineTo(px + twistX, py + twistY);
    });

    ctx.closePath();
    ctx.stroke();
  }

  ctx.restore();
}

function makeWavePath(cx,cy,rx,ry,index,power,count){
  const phase = index * 41;
  let dString = "";

  for(let i=0;i<=count;i++){
    const t = i / count;
    const a = t * Math.PI * 2;

    const d = voiceData[(i + phase) % voiceData.length] || {amp:.4,pitch:.4};

    const twist =
      Math.sin(a * 3 + d.pitch * 9 + index) * d.pitch * .38 +
      Math.sin(a * 7 + d.amp * 5) * d.amp * .18;

    const aa = a + twist;

    const squareMorph = Math.max(
      Math.abs(Math.cos(aa)),
      Math.abs(Math.sin(aa))
    );

    const letterInfluence =
      .72 +
      .28 * Math.sin(aa * 2 + index) +
      .16 * Math.sin(aa * 5 + d.pitch * 8);

    const baseX = Math.cos(aa) * rx / squareMorph;
    const baseY = Math.sin(aa) * ry / squareMorph;

    const toneWave =
      Math.sin(aa * (5 + d.pitch * 20) + d.pitch * 14) *
      power *
      d.pitch *
      .55;

    const volumeWave = d.amp * power;

    const breathe =
      Math.sin(a * 2 + index * 1.7) *
      power *
      .12;

    const offset = volumeWave + toneWave + breathe;

    const nx = baseX / rx;
    const ny = baseY / ry;

    const x = cx + baseX * letterInfluence + nx * offset;
    const y = cy + baseY * letterInfluence + ny * offset;

    dString += i === 0 ? `M ${x} ${y}` : ` L ${x} ${y}`;
  }

  return dString + " Z";
}
</script>
